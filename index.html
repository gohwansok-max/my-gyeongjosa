<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#2c5f4f">
<title>경조사 장부</title>
<style>
  :root{
    --main:#2c5f4f;
    --main-light:#e8f3ef;
    --accent:#c65d3b;
    --text:#1c1c1c;
    --sub:#6b6b6b;
    --border:#dcdcdc;
    --bg:#f7f6f2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  header{
    background:var(--main);
    color:#fff;
    padding:18px 16px 16px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
  }
  header h1{
    margin:0 0 14px;
    font-size:24px;
    font-weight:700;
    text-align:center;
    letter-spacing:-0.5px;
  }
  .search-wrap{
    display:flex;
    gap:8px;
  }
  #searchInput{
    flex:1;
    font-size:24px;
    padding:16px 18px;
    border:none;
    border-radius:14px;
    outline:none;
    -webkit-appearance:none;
  }
  #clearBtn{
    display:none;
    font-size:20px;
    padding:0 18px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,0.25);
    color:#fff;
    font-weight:700;
  }
  .chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 4px 2px;
    -webkit-overflow-scrolling:touch;
  }
  .chip{
    flex:none;
    padding:10px 16px;
    background:rgba(255,255,255,0.15);
    color:#fff;
    border-radius:999px;
    font-size:16px;
    font-weight:600;
    white-space:nowrap;
    border:1.5px solid rgba(255,255,255,0.4);
  }
  .chip.active{
    background:#fff;
    color:var(--main);
    border-color:#fff;
  }
  .summary{
    padding:14px 16px 4px;
    font-size:17px;
    color:var(--sub);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .summary b{
    color:var(--main);
    font-size:19px;
  }
  #list{
    padding:6px 12px 40px;
  }
  .card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:10px;
  }
  .card .row1{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .card .name{
    font-size:23px;
    font-weight:700;
    color:var(--text);
    word-break:keep-all;
  }
  .card .amount{
    font-size:21px;
    font-weight:700;
    color:var(--accent);
    white-space:nowrap;
  }
  .card .memo{
    margin-top:6px;
    font-size:17px;
    color:var(--sub);
  }
  .card .cat{
    display:inline-block;
    margin-top:8px;
    font-size:14px;
    color:var(--main);
    background:var(--main-light);
    padding:3px 10px;
    border-radius:8px;
    font-weight:600;
  }
  mark{
    background:#ffe9a8;
    color:inherit;
    border-radius:3px;
    padding:0 2px;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    font-size:19px;
    padding:60px 20px;
    line-height:1.6;
  }
  .top-btn{
    position:fixed;
    right:16px;
    bottom:20px;
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--main);
    color:#fff;
    font-size:22px;
    border:none;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);
    display:none;
  }
</style>
</head>
<body>
<header>
  <h1>경조사 장부 조회</h1>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="이름 또는 소속·주소로 검색" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="clearBtn">지우기</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div class="summary">
  <span><b id="cnt">0</b>명 검색됨</span>
  <span>합계 <b id="sum">0</b>원</span>
</div>

<div id="list"></div>

<button class="top-btn" id="topBtn">↑</button>

<script>
const DATA = JSON.parse(document.getElementById('data-holder').textContent);

const CATS = ['전체', ...Array.from(new Set(DATA.map(d=>d.category)))];

const chipsEl = document.getElementById('chips');
let activeCat = '전체';
CATS.forEach(c=>{
  const b = document.createElement('button');
  b.className = 'chip' + (c===activeCat ? ' active':'');
  b.textContent = c;
  b.dataset.cat = c;
  b.onclick = () => {
    activeCat = c;
    document.querySelectorAll('.chip').forEach(el=>el.classList.remove('active'));
    b.classList.add('active');
    render();
  };
  chipsEl.appendChild(b);
});

const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const listEl = document.getElementById('list');
const cntEl = document.getElementById('cnt');
const sumEl = document.getElementById('sum');

function fmtNum(n){
  return n.toLocaleString('ko-KR');
}

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function render(){
  const q = searchInput.value.trim();
  clearBtn.style.display = q ? 'block' : 'none';

  let filtered = DATA.filter(d => activeCat === '전체' || d.category === activeCat);
  if(q){
    const ql = q.toLowerCase();
    filtered = filtered.filter(d =>
      (d.name && d.name.toLowerCase().includes(ql)) ||
      (d.memo && d.memo.toLowerCase().includes(ql))
    );
  }

  cntEl.textContent = fmtNum(filtered.length);
  const total = filtered.reduce((a,d)=> a + (d.amount || 0), 0);
  sumEl.textContent = fmtNum(total);

  if(filtered.length === 0){
    listEl.innerHTML = '<div class="empty">검색 결과가 없습니다.<br>다른 이름이나 지역으로 찾아보세요.</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  const html = filtered.slice(0, 500).map(d => {
    const amountText = d.amount != null ? fmtNum(d.amount) + '원' : (d.amount_raw || '-');
    return `<div class="card">
      <div class="row1">
        <div class="name">${highlight(d.name, q)}</div>
        <div class="amount">${escapeHtml(amountText)}</div>
      </div>
      ${d.memo ? `<div class="memo">${highlight(d.memo, q)}</div>` : ''}
      <div class="cat">${escapeHtml(d.category)}</div>
    </div>`;
  }).join('');
  listEl.innerHTML = html;
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  render();
});

const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll', () => {
  topBtn.style.display = window.scrollY > 400 ? 'block' : 'none';
});
topBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

render();
</script>
</body>
</html>
